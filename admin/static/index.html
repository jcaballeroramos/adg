<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Artefactos de Guerra</title>
<link rel="stylesheet" href="/admin/static/admin.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css">
<script src="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.js"></script>
</head>
<body>

<!-- Login -->
<div id="login-screen" class="login-wrap" style="display:none">
  <div class="login-box">
    <h1>Artefactos de Guerra</h1>
    <input id="login-user" type="text" placeholder="Usuario" autocomplete="username">
    <input id="login-pass" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button onclick="doLogin()">Entrar</button>
    <div id="login-error" class="login-error"></div>
  </div>
</div>

<!-- App -->
<div id="app-screen" style="display:none">
  <div class="topbar">
    <h1>Artefactos de Guerra — Admin</h1>
    <div class="topbar-right">
      <span class="topbar-user" id="topbar-user"></span>
      <button class="btn" onclick="triggerBuild()">Rebuild</button>
      <a class="btn" href="/" target="_blank">Ver sitio</a>
      <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="Cambiar tema"></button>
      <button class="btn" onclick="doLogout()">Salir</button>
    </div>
  </div>
  <div class="app">
    <div class="sidebar-admin" id="sidebar"></div>
    <div class="main-panel" id="main"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<script src="/admin/static/admin.js"></script>
</body>
</html>
