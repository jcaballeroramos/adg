# Nixpacks override — Python 3.11 con virtualenv (evita PEP 668)

[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "python311Packages.virtualenv"]

[phases.install]
cmds = [
  "python -m venv /opt/venv",
  ". /opt/venv/bin/activate && pip install --upgrade pip && pip install markdown pyyaml fastapi 'uvicorn[standard]' python-multipart itsdangerous bcrypt"
]

[phases.build]
cmds = [". /opt/venv/bin/activate && python build.py"]

[start]
cmd = ". /opt/venv/bin/activate && python -m uvicorn admin.server:app --host 0.0.0.0 --port $PORT"
